[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy-office-parser"
version = "0.5.0"
description = "Focused text and structure extraction from legacy Office, RTF and OpenDocument"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "licenses/*.txt", "THIRD_PARTY.md"]
dependencies = ["olefile>=0.47,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "build>=1,<2"]

[project.scripts]
legacy-office-parser = "legacy_office_parser.cli:main"

[project.urls]
Repository = "https://github.com/umount/legacy-office-parser"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
