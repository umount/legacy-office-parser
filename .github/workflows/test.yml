name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests tools
      - name: Run tests with failure annotations
        run: |
          python - <<'PYTEST'
          import subprocess
          import sys
          result = subprocess.run([sys.executable, '-m', 'pytest', '-q'],
                                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          print(result.stdout, end='')
          if result.returncode:
              detail = result.stdout[-24000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Pytest failure::' + detail)
          raise SystemExit(result.returncode)
          PYTEST
      - name: Sample malformed public fixtures
        run: timeout 120s python tools/check_mutations.py --seed 143 --cases-per-format 500
      - name: Check bounded parsing and repeated allocations
        run: python tools/check_security_resources.py
      - run: python -m build
      - name: Verify installed wheel outside the source import path
        run: |
          python -m venv /tmp/legacy-wheel-check
          /tmp/legacy-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/legacy-wheel-check/bin/python -I tools/check_wheel.py tests/fixtures
  libreoffice-reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development reference
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress
          libreoffice --version
      - run: python -m pip install -e '.[dev]'
      - name: Check original documents against LibreOffice
        env:
          RTF_FIDELITY_LO: '1'
          RTF_NESTED_LO: '1'
          ODF_NOTES_LIBREOFFICE: '1'
          ODF_STORIES_LIBREOFFICE: '1'
          OFFICE_CORPUS_LIBREOFFICE: '1'
          AUXILIARY_REFERENCE_LO: '1'
        run: |
          python -m pytest -q tests/test_rtf_fidelity.py tests/test_odf_notes.py tests/test_odf_stories.py tests/test_live_corpus.py tests/test_doc_styles.py tests/test_nested_reference.py tests/test_rtf_nested.py tests/test_doc_nested.py tests/test_doc_sections.py tests/test_auxiliary_reference.py
          python tools/check_corpus.py tests/fixtures --libreoffice --fail-on-difference > reference-report.json
          python tools/check_corpus.py tests/fixtures/doc_nested --libreoffice --fail-on-difference > nested-reference-report.json
          python tools/check_corpus.py tests/fixtures/doc_sections/clean_section_before_table.doc --libreoffice --fail-on-difference > section-reference-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-fixture-reference-report
          path: |
            reference-report.json
            nested-reference-report.json
            section-reference-report.json
