name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests tools
      - run: python -m pytest -q
      - run: python -m build
      - name: Verify installed wheel outside the source import path
        run: |
          python -m venv /tmp/legacy-wheel-check
          /tmp/legacy-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/legacy-wheel-check/bin/python -I tools/check_wheel.py tests/fixtures
