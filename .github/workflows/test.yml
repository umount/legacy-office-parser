name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests tools
      - name: Run tests with failure annotations
        run: |
          python - <<'PYTEST'
          import subprocess
          import sys
          result = subprocess.run([sys.executable, '-m', 'pytest', '-q', '--tb=short'],
                                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          print(result.stdout, end='')
          if result.returncode:
              detail = result.stdout[-3500:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Pytest failure::' + detail)
          raise SystemExit(result.returncode)
          PYTEST
      - name: Sample malformed public fixtures
        run: timeout 120s python tools/check_mutations.py --seed 143 --cases-per-format 500
      - name: Sample the complete authored fixture corpus
        run: timeout 120s python tools/check_mutations.py --seed 143 --cases-per-format 100 --all-fixtures
      - name: Check bounded parsing and repeated allocations
        run: python tools/check_security_resources.py
      - run: python -m build
      - name: Verify installed wheel outside the source import path
        run: |
          python -m venv /tmp/legacy-wheel-check
          /tmp/legacy-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/legacy-wheel-check/bin/python -I tools/check_wheel.py tests/fixtures
  libreoffice-reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development reference
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress python3-uno
          libreoffice --version
      - run: python -m pip install -e '.[dev]'
      - name: Check original documents against LibreOffice
        env:
          RTF_FIDELITY_LO: '1'
          RTF_NESTED_LO: '1'
          RTF_LEGACY_LO: '1'
          RTF_FALLBACK_LO: '1'
          ODF_NOTES_LIBREOFFICE: '1'
          ODF_STORIES_LIBREOFFICE: '1'
          ODF_INLINE_LO_ORACLE: '1'
          ODF_PASSIVE_RESEARCH_LO: '1'
          ODS_FLOATING_LO: '1'
          OFFICE_CORPUS_LIBREOFFICE: '1'
          AUXILIARY_REFERENCE_LO: '1'
        run: |
          python - <<'REFERENCE'
          import pathlib
          import subprocess
          import sys
          commands = [
              ([sys.executable, '-m', 'pytest', '-q', '--tb=short', 'tests/test_rtf_fidelity.py',
                'tests/test_odf_notes.py', 'tests/test_odf_stories.py', 'tests/test_live_corpus.py',
                'tests/test_doc_styles.py', 'tests/test_nested_reference.py', 'tests/test_rtf_nested.py',
                'tests/test_doc_nested.py', 'tests/test_doc_sections.py', 'tests/test_auxiliary_reference.py',
                'tests/test_doc_external_ole.py', 'tests/test_xls_formats_ole.py', 'tests/test_xls_literals_ole.py',
                'tests/test_xls_sections_ole.py', 'tests/test_rtf_story_blocks.py', 'tests/test_xls_conditions.py',
                'tests/test_odf_inline_objects.py', 'tests/test_rtf_legacy_textboxes.py', 'tests/test_rtf_wordart.py',
                'tests/test_rtf_fallback_text.py',
                'tests/test_xls_scaled_currency_ole.py', 'tests/test_odf_passive_research.py',
                'tests/test_doc_notes.py', 'tests/test_ods_floating_research.py',
                'tests/test_ppt_comments_research.py', 'tests/test_xls_hidden_sections_ole.py'], None),
              ([sys.executable, 'tools/check_corpus.py', 'tests/fixtures', '--libreoffice',
                '--fail-on-difference'], 'reference-report.json'),
              ([sys.executable, 'tools/check_corpus.py', 'tests/fixtures/doc_nested', '--libreoffice',
                '--fail-on-difference'], 'nested-reference-report.json'),
              ([sys.executable, 'tools/check_corpus.py', 'tests/fixtures/doc_sections/clean_section_before_table.doc',
                '--libreoffice', '--fail-on-difference'], 'section-reference-report.json'),
          ]
          for command, report in commands:
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              print(result.stdout, end='')
              if report:
                  pathlib.Path(report).write_text(result.stdout)
              if result.returncode:
                  detail = result.stdout[-3500:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=Reference check failure::' + detail)
                  raise SystemExit(result.returncode)
          REFERENCE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-fixture-reference-report
          path: |
            reference-report.json
            nested-reference-report.json
            section-reference-report.json
